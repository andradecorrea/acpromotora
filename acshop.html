<!DOCTYPE html>
<html>
<head>
  <title>AC Shop Ofertas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXX');
  </script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 30px;
      background: #111;
      color: white;
    }

    img {
      max-width: 250px;
      border-radius: 10px;
      margin: 20px 0;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      background: #ff3b3b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2 id="titulo">Oferta exclusiva 🔥</h2>

<img id="imagem" src="" alt="Produto">

<p>Clique abaixo para ver a oferta completa</p>

<button onclick="irParaProduto()">VER OFERTA</button>

<script>
const params = new URLSearchParams(window.location.search);

const produto = params.get("p");
const origem = params.get("src");
const link = params.get("link");

// Ajuste simples de conteúdo
if (produto) {
  document.getElementById("titulo").innerText = produto;
}

// Você pode depois melhorar isso com imagens dinâmicas
document.getElementById("imagem").src = "https://via.placeholder.com/250";

// Função de clique
function irParaProduto() {

  // Evento de rastreio
  gtag('event', 'click_produto', {
    produto: produto,
    origem: origem
  });

  // Redireciona
  window.location.href = link;
}
</script>

</body>
</html>
